name: LightroomCanon
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: NO
    # Local development signing so the app builds & runs without a paid team.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: YES

packages:
  # Reads real .zip archives (e.g. downloaded Lightroom preset packs) entry
  # by entry, straight into memory — no built-in Apple framework does this:
  # AppleArchive is Apple's own (.aar/LZFSE) format, not ZIP.
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.0

targets:
  LightroomCanon:
    type: application
    # A single multiplatform target that XcodeGen expands into an iOS and a
    # macOS variant, both sharing every source file under LightroomCanon/.
    platform: [iOS, macOS]
    sources:
      - path: LightroomCanon
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.LightroomCanon
        PRODUCT_NAME: LightroomCanon
        INFOPLIST_FILE: LightroomCanon/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        # iCloud sync (optional, requires a paid Apple Developer account —
        # see AppConfig.swift). Uncomment once you've created an iCloud
        # container and set AppConfig.iCloudSyncEnabled = true:
        # CODE_SIGN_ENTITLEMENTS: LightroomCanon/LightroomCanon.entitlements
      configs:
        # macOS local runs need this off; iOS ignores it.
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ENABLE_HARDENED_RUNTIME: NO
